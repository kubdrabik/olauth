[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olauth"
version = "1.1.0"
description = "The zero-config, one-liner authentication engine for Python web frameworks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jakub Drábik", email = "drabik@felicitous.dev" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Crucial: These are the external libraries pip will auto-download for your users
dependencies = [
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
flask = ["flask>=2.0.0"]
fastapi = ["fastapi>=0.100.0"]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["pymysql>=1.1.0"]
dev = ["pytest>=7.0.0", "flask>=2.0.0", "fastapi>=0.100.0", "httpx>=0.24.0"]

# This tells Hatch exactly where your package source files live
[tool.hatch.build.targets.wheel]
packages = ["src/olauth"]