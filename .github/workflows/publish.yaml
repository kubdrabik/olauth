name: Publish to PyPI

# Trigger the workflow when a new release is created on GitHub
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for secure, passwordless authentication with PyPI (OIDC)
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build and test tools
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e ".[dev]"

    - name: Run tests
      run: pytest -v

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1